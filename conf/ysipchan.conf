; SIP channel: listen on UDP 5060 on all interfaces.
; Every REGISTER, INVITE and MESSAGE is challenged against the passwords
; in regfile.conf (auth_required defaults to on).

[general]
addr=0.0.0.0
port=5060
realm=petit_telephone
useragent=petit_telephone

[registrar]
; phones re-register at least this often, so a PBX restart (which forgets
; registrations) heals within 5 minutes
expires_max=300

[message]
; handset-to-handset text messages (SIP MESSAGE), relayed via regfile
enable=yes
