; Call routing. Runs at priority 40, before regfile (50), so it can
; demand authentication before any call is connected.
; A call that matches no rule here falls through to regfile, which
; connects the dialed extension if it is registered (or fails the call
; as "offline" if it isn't).

[priorities]
route=40

[default]
; INVITEs arrive without credentials; "noauth" makes ysipchan answer
; 401 so the phone retries with its extension's password
${username}^$=-;error=noauth
; text messages (SIP MESSAGE, route_type=msg): leave them all to
; regfile, which relays them to the recipient's registered handset.
; osip-prefix: only copy osip_* params into the relayed MESSAGE as
; headers (the default "sip_" would echo the sender's own From/To/...
; headers back in as duplicates, and handsets drop the message)
; user: From of the relayed MESSAGE = the sender's authenticated
; extension, so the recipient sees who it's from and can reply
${route_type}^msg$=return;osip-prefix=osip_;user=${username}
; echo test: answers and plays your own voice back
^600$=external/playrec/echo.sh
