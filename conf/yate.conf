; Load only what a small SIP PBX needs. Yate otherwise loads every module
; it was built with, and with host networking some of them (IAX, MGCP,
; Jabber, ...) would open ports on the LAN.

[general]
modload=no

[modules]
; SIP signalling + RTP media
ysipchan.yate=yes
yrtpchan.yate=yes
; extension passwords, registrations, routing to registered phones
regfile.yate=yes
; call.route rules (auth demand, 600 echo)
regexroute.yate=yes
; runs the 600 echo script
extmodule.yate=yes
; ringback/busy tones
tonegen.yate=yes
; admin console, telnet 127.0.0.1 5038 (loopback only by default)
rmanager.yate=yes
