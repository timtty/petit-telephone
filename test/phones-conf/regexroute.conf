; call.sh originates "out-<number>": dial it through the PBX as
; extension 555 (line= picks the account whose credentials answer the
; PBX's auth challenge).
; message.sh originates "sms-<number>": instead of a call, send a SIP
; MESSAGE from 555 through the PBX, then fail the dummy call.
; Inbound text messages are printed to the log; any other call the PBX
; sends us (to 555 or 888) is answered by the echo script, which loops
; the caller's audio back.

[default]
^sms-\([0-9]*\)$=dispatch msg.execute;callto=sip/sip:\1@pbx;user=555;password=test555;xsip_type=text/plain;xsip_body=hello from 555
^sms-=-;error=noconn
${route_type}^msg$=echo MESSAGE from ${caller} to ${called}: ${xsip_body}
${route_type}^msg$=-;error=noroute
^out-\(.*\)$=line/\1;line=ext555
.*=external/playrec/echo.sh
